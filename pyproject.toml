[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "causaleffect"
version = "0.1.0"
description = "Compute conditional and non-conditional causal effects"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Martí Pedemonte", email = "pedemonte96@gmail.com" }]
keywords = ["causality", "causal effects", "identification", "graphs"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = ["igraph>=0.11", "numpy"]

[project.urls]
Homepage = "https://github.com/pedemonte96/causaleffect"
Issues = "https://github.com/pedemonte96/causaleffect/issues"
Documentation = "https://pedemonte96.github.io/causaleffect/causaleffect.html"
Changelog = "https://github.com/pedemonte96/causaleffect/blob/main/CHANGELOG.md"

[project.optional-dependencies]
plot = ["pycairo>=1.17.2"]
dev = ["build>=1.2", "mypy>=2", "pdoc>=16", "pytest>=8", "pytest-cov>=5", "ruff>=0.16", "twine>=6"]

[tool.setuptools]
packages = ["causaleffect"]

[tool.setuptools.package-data]
causaleffect = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["causaleffect"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.mypy]
files = ["causaleffect"]
python_version = "3.11"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["igraph", "igraph.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Keep the established public API and notation for causal graph variables.
ignore = ["N802", "N803", "N806"]
select = [
    "ANN",
    "B",
    "C4",
    "E",
    "F",
    "I",
    "N",
    "PIE",
    "PT",
    "RET",
    "RUF",
    "SIM",
    "TID",
    "UP",
]

[tool.ruff.lint.per-file-ignores]
"examples/*.ipynb" = ["E501"]  # Preserve long mathematical expressions in notebook comments.
